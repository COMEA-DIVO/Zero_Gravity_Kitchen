rr(6,5,W-12,H-10,36,null,'#335d54',10);rr(12,11,W-24,H-22,33,null,'#bdac73',3);rr(19,18,W-38,H-36,29,null,'#e3d8a6',1);ctx.save();ctx.globalAlpha=.83;let lw=Math.min(W*.29,170),lh=41*scale;rr(30,H-66*scale,lw,lh,8,'#40756a','#e0ca8a',2);rr(35,H-61*scale,lw-10,lh*.55,5,'#214c4a');for(let i=0;i<4;i++){ellipse(45+i*13,H-50*scale,3,3,i===0?'#f9d77a':'#83d6a8');}rr(W-lw-30,24,lw,33*scale,8,'#447a70','#e0ca8a',2);for(let i=0;i<4;i++)rr(W-lw-22+i*(lw-16)/4,30,(lw-25)/4,19*scale,3,'#9cc1a0','#2f6155');ctx.restore();
// Subtle radar grid and suspended counter ring.
ctx.save();ctx.globalAlpha=.11;for(let x=38;x<W-15;x+=44)for(let y=36;y<H-15;y+=44){line(x-2,y,x+2,y,'#174f4c');line(x,y-2,x,y+2,'#174f4c')}ctx.restore();ellipse(W/2,H/2,Math.min(W,H)*.34,Math.min(W,H)*.34,null,'#f4efd264',1.5);ellipse(W/2,H/2,Math.min(W,H)*.19,Math.min(W,H)*.19,null,'#e9f4d54a',1.2);for(let i=0;i<13;i++){let x=(i*137.2+43)%W,y=(i*67.7+20)%H;star(x,y,2+Math.sin(time*.9+i)*1.4,'#fff6c999')}for(let x of [20,W-20])for(let y of [25,H-25])ellipse(x,y,3,3,'#e8d18f','#345d53')}
function drawFood(f){let s=scale, r=f.radius;ctx.save();ctx.translate(f.x,f.y);if(target===f||hovered===f){ctx.setLineDash([5,4]);ellipse(0,0,r+6,r+6,null,target===f?'#fff0a8':'#fffae6',2);ctx.setLineDash([])}if(target===f){for(let a=0;a<4;a++){let t=a*Math.PI/2+time*1.8;star(Math.cos(t)*(r+9),Math.sin(t)*(r+9),4,'#fff0ab')}}ellipse(2,5,r+1,r*.83,'#235f5144');let g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#ffffee');g.addColorStop(1,'#e0e9c7');ellipse(0,0,r,r,g,'#477d67',1.3);ellipse(-r*.32,-r*.4,r*.32,r*.12,'#ffffffbd');ctx.save();ctx.rotate(f.rot+Math.sin(time*.8+f.phase)*.065);ctx.font=`${28*s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(FOOD[f.k][0],0,-1*s);ctx.restore();if(W>560||target===f||hovered===f){ctx.font=`700 ${10*s}px system-ui,sans-serif`;let label=FOOD[f.k][1],tw=ctx.measureText(label).width;rr(-tw/2-5,r-2,tw+10,14*s,6,'#214e46dc');ctx.fillStyle='#fff9db';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,r+5*s)}ctx.restore()}
function drawChef(){let s=scale;ctx.save();ctx.translate(chef.x,chef.y);let speed=Math.hypot(chef.vx,chef.vy);if(state==='playing'){ctx.setLineDash([4,6]);ellipse(0,0,39*s,39*s,null,'#fff6c7b5',1.4);ctx.setLineDash([])}ctx.scale(s,s);ctx.rotate(clamp(chef.vx/650,-.28,.28));if(speed>35&&state==='playing'){let a=Math.atan2(chef.vy,chef.vx);ctx.save();ctx.rotate(a);let flame=10+Math.sin(time*26)*4+speed*.04;poly([[-13,-9],[-13-flame,0],[-13,9]],'#ffbb63','#e88f4e',1);poly([[-13,-5],[-19-flame*.4,0],[-13,5]],'#fff2ac');ctx.restore()}ellipse(1,26,17,6,'#27695d33');rr(-21,-10,12,30,5,'#638a8c','#254d4c',2);rr(10,-10,12,30,5,'#638a8c','#254d4c',2);ellipse(-10,22,7,6,'#436c66','#284b4a',1.5);ellipse(10,22,7,6,'#436c66','#284b4a',1.5);rr(-16,-5,32,27,11,'#f9eed1','#315c55',2);rr(-10,1,20,15,5,'#76b59a','#487f70',1);star(0,8,5,'#fff2b1');ellipse(-19,6,6,8,'#f9ebce','#315c55',1.5);ellipse(19,6,6,8,'#f9ebce','#315c55',1.5);ellipse(0,-14,20,18,'#e2f6e8','#315c55',2);ellipse(0,-13,14,12,'#f1c897','#a97f61',1);ellipse(-7,-15,2,3,'#2f4d48');ellipse(7,-15,2,3,'#2f4d48');ctx.beginPath();ctx.arc(0,-11,4,0,Math.PI);ctx.strokeStyle='#785b4b';ctx.lineWidth=1.5;ctx.stroke();ellipse(-12,-20,4,6,'#fffef1a0');rr(-14,-28,28,9,4,'#fff4db','#527d6c',1.5);ellipse(-10,-30,8,8,'#fff5de','#527d6c',1.2);ellipse(0,-33,10,9,'#fff5de','#527d6c',1.2);ellipse(10,-30,8,8,'#fff5de','#527d6c',1.2);rr(-14,-29,28,5,3,'#fff5de');ctx.restore();if(state==='playing'){rr(chef.x-18,chef.y+30*s,36,13,6,'#173f38db');ctx.font='800 9px system-ui';ctx.fillStyle='#ffefb8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('YOU',chef.x,chef.y+30*s+6)}}
function draw(){ctx.clearRect(0,0,W,H);background();if(target&&food.includes(target)&&state==='playing'){ctx.save();ctx.setLineDash([4,7]);ctx.lineDashOffset=-time*25;line(chef.x,chef.y,target.x,target.y,'#fff9cecf',2);ctx.restore()}if(waypoint&&state==='playing'){ellipse(waypoint.x,waypoint.y,11,11,null,'#fff0ac',2);star(waypoint.x,waypoint.y,6,'#fff6ca')}for(let f of food)drawFood(f);for(let r of rings){ctx.globalAlpha=clamp(r.life*1.8,0,1);ellipse(r.x,r.y,r.r,r.r,null,r.color,2);ctx.globalAlpha=1}for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);star(p.x,p.y,p.size,p.color);ctx.globalAlpha=1}drawChef();if(drag?.moved&&!drag.f){let a=drag.start,b=drag.now,dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy),max=48;ellipse(a.x,a.y,40,40,'#143b3540','#fff9df88',1.5);ellipse(a.x+dx/Math.max(m,1)*Math.min(m,max),a.y+dy/Math.max(m,1)*Math.min(m,max),17,17,'#e7eec7ba','#fff8df',2)}if(drag?.moved&&drag.grab&&drag.f){line(chef.x,chef.y,drag.f.x,drag.f.y,'#f9e4a6aa',2)}}
function frame(now){let dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;step(dt);draw();requestAnimationFrame(frame)}
